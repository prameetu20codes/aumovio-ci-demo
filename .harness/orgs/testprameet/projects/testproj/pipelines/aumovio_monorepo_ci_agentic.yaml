pipeline:
  name: Aumovio Monorepo CI - Agentic
  identifier: aumovio_monorepo_ci_agentic
  projectIdentifier: testproj
  orgIdentifier: testprameet
  description: "Aumovio monorepo CI extended with Harness Worker Agents: an AI workflow router that can only escalate a deterministic plan, cross-service E2E tests with AI failure triage (regression vs outdated test) and a fail-closed quality gate, an AI Dockerfile and build-cache optimizer behind a hadolint gate, AI code review on pull requests and AI autofix on failure. Build, test and security stages are identical to aumovio_monorepo_ci."
  tags:
    customer: aumovio
    module: ci
    ai: worker-agents
  allowStageExecutions: true
  properties:
    ci:
      codebase:
        connectorRef: harnessiacm
        repoName: aumovio-ci-demo
        build: <+input>
        sparseCheckout: []
  variables:
    - name: har_registry
      type: String
      description: Harness Artifact Registry (Docker) that receives the images built by this pipeline.
      required: true
      value: aumovio-snapshot
    - name: force_all
      type: String
      description: Set to true to build every service even if its folder did not change.
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: e2e_scenario
      type: String
      description: "Demo only: inject a known change before E2E. regression breaks the telemetry speed average; outdated_test renames a dashboard field on purpose."
      required: false
      value: <+input>.default(none).allowedValues(none,regression,outdated_test)
    - name: triage_confidence_threshold
      type: String
      description: Minimum triage confidence (0-100) for an agent verdict to influence the E2E gate. Below it, failures always block.
      required: true
      value: "80"
    - name: outdated_test_policy
      type: String
      description: warn lets the build continue when every E2E failure is a confident OUTDATED_TEST verdict; block fails it until the tests are updated.
      required: true
      value: <+input>.default(warn).allowedValues(warn,block)
  notificationRules:
    - name: CI failure to Slack
      identifier: ci_failure_to_slack
      pipelineEvents:
        - type: PipelineFailed
      notificationMethod:
        type: Slack
        spec:
          userGroups: []
          webhookUrl: <+secrets.getValue("slack_ci_webhook")>
      enabled: false
  stages:
    - stage:
        name: Detect Changes
        identifier: detect_changes
        description: Diffs the PR against its base and exports which services changed.
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
          buildIntelligence:
            enabled: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Detect Changes
                  identifier: detect_changes
                  spec:
                    shell: Bash
                    command: . scripts/ci/detect-changes.sh
                    envVariables:
                      BUILD_TYPE: <+codebase.build.type>
                      BASE_SHA: <+codebase.baseCommitSha>
                      PR_NUMBER: <+codebase.prNumber>
                      BRANCH: <+codebase.branch>
                      SHORT_SHA: <+codebase.shortCommitSha>
                      FORCE_ALL: <+pipeline.variables.force_all>
                      HARNESS_ACCOUNT: <+account.identifier>
                      HAR_REGISTRY: <+pipeline.variables.har_registry>
                    outputVariables:
                      - name: GO_CHANGED
                      - name: JAVA_CHANGED
                      - name: NODE_CHANGED
                      - name: IMAGE_TAG
                      - name: HAR_REPO_PATH
                      - name: HAR_IMAGE_PREFIX
                  timeout: 5m
        failureStrategies:
          - onFailure:
              errors:
                - Connectivity
                - Timeout
              action:
                type: Retry
                spec:
                  retryCount: 2
                  retryIntervals:
                    - 10s
                  onRetryFailure:
                    action:
                      type: MarkAsFailure
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - parallel:
        - stage:
            name: Code Security
            identifier: code_security
            description: Secret detection, SAST and SCA across the whole repository.
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: false
              buildIntelligence:
                enabled: false
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - parallel:
                      - step:
                          type: Gitleaks
                          name: Secret Detection - Gitleaks
                          identifier: secret_detection_gitleaks
                          spec:
                            mode: orchestration
                            config: default
                            target:
                              type: repository
                              detection: auto
                            advanced:
                              log:
                                level: info
                              fail_on_severity: high
                          timeout: 15m
                      - step:
                          type: Semgrep
                          name: SAST - Semgrep
                          identifier: sast_semgrep
                          spec:
                            mode: orchestration
                            config: default
                            target:
                              type: repository
                              detection: auto
                            advanced:
                              log:
                                level: info
                              fail_on_severity: none
                          timeout: 15m
                      - step:
                          type: OsvScanner
                          name: SCA - OSV Scanner
                          identifier: sca_osv
                          spec:
                            mode: orchestration
                            config: default
                            target:
                              type: repository
                              detection: auto
                            advanced:
                              log:
                                level: info
                              fail_on_severity: critical
                          timeout: 15m
            failureStrategies:
              - onFailure:
                  errors:
                    - Connectivity
                    - Timeout
                  action:
                    type: Retry
                    spec:
                      retryCount: 2
                      retryIntervals:
                        - 10s
                      onRetryFailure:
                        action:
                          type: MarkAsFailure
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: MarkAsFailure
        - stage:
            name: Change Intelligence
            identifier: change_intelligence
            description: Deterministic change analysis plus the Workflow Router agent. The agent can only escalate the baseline plan that decides whether E2E and the Dockerfile review run.
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: false
              buildIntelligence:
                enabled: false
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Collect Change Context
                      identifier: collect_change_context
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          node scripts/ci/change-context.mjs
                          set -a; . "$AGENT_DIR/change/baseline.env"; set +a
                        envVariables:
                          BUILD_TYPE: <+codebase.build.type>
                          BASE_SHA: <+codebase.baseCommitSha>
                          PR_NUMBER: <+codebase.prNumber>
                          BRANCH: <+codebase.branch>
                          FORCE_ALL: <+pipeline.variables.force_all>
                          E2E_SCENARIO: <+pipeline.variables.e2e_scenario>
                        outputVariables:
                          - name: BASELINE_RUN_E2E
                          - name: BASELINE_RUN_DOCKERFILE_REVIEW
                          - name: BASELINE_RISK_LEVEL
                          - name: BASELINE_CHANGE_CATEGORY
                      timeout: 5m
                  - step:
                      type: Agent
                      name: Route Workflow - AI
                      identifier: route_workflow
                      spec:
                        agentName: ca_workflow_router
                        agentSettings:
                          changeContextPath: /harness/.agent/change/context.md
                          diffPath: /harness/.agent/change/diff.patch
                          outputDir: /harness/.agent/output
                          repository: prameetu20codes/aumovio-ci-demo
                      timeout: 15m
                      failureStrategies:
                        - onFailure:
                            errors:
                              - AllErrors
                            action:
                              type: Retry
                              spec:
                                retryCount: 1
                                retryIntervals:
                                  - 15s
                                onRetryFailure:
                                  action:
                                    type: MarkAsSuccess
                  - step:
                      type: Run
                      name: Resolve Workflow Plan
                      identifier: resolve_plan
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          node scripts/ci/resolve-plan.mjs
                          set -a; . "$AGENT_DIR/change/plan.env"; set +a
                          if [ -f "$AGENT_DIR/output/workflow-plan.md" ]; then
                            echo "----- Workflow Router report -----"
                            cat "$AGENT_DIR/output/workflow-plan.md"
                          fi
                        envVariables:
                          BASELINE_RUN_E2E: <+execution.steps.collect_change_context.output.outputVariables.BASELINE_RUN_E2E>
                          BASELINE_RUN_DOCKERFILE_REVIEW: <+execution.steps.collect_change_context.output.outputVariables.BASELINE_RUN_DOCKERFILE_REVIEW>
                          BASELINE_RISK_LEVEL: <+execution.steps.collect_change_context.output.outputVariables.BASELINE_RISK_LEVEL>
                          BASELINE_CHANGE_CATEGORY: <+execution.steps.collect_change_context.output.outputVariables.BASELINE_CHANGE_CATEGORY>
                          AGENT_RUN_E2E: <+execution.steps.route_workflow.steps.ca_workflow_router_1.output.outputVariables.RUN_E2E>
                          AGENT_RUN_DOCKERFILE_REVIEW: <+execution.steps.route_workflow.steps.ca_workflow_router_1.output.outputVariables.RUN_DOCKERFILE_REVIEW>
                          AGENT_RISK_LEVEL: <+execution.steps.route_workflow.steps.ca_workflow_router_1.output.outputVariables.RISK_LEVEL>
                          AGENT_CHANGE_CATEGORY: <+execution.steps.route_workflow.steps.ca_workflow_router_1.output.outputVariables.CHANGE_CATEGORY>
                          AGENT_RATIONALE: <+execution.steps.route_workflow.steps.ca_workflow_router_1.output.outputVariables.RATIONALE>
                        outputVariables:
                          - name: RUN_E2E
                          - name: RUN_DOCKERFILE_REVIEW
                          - name: RISK_LEVEL
                          - name: CHANGE_CATEGORY
                          - name: PLAN_SOURCE
                      when:
                        stageStatus: All
                      timeout: 5m
            variables:
              - name: AGENT_DIR
                type: String
                value: /harness/.agent
            failureStrategies:
              - onFailure:
                  errors:
                    - Connectivity
                    - Timeout
                  action:
                    type: Retry
                    spec:
                      retryCount: 2
                      retryIntervals:
                        - 10s
                      onRetryFailure:
                        action:
                          type: MarkAsFailure
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: MarkAsFailure
        - stage:
            name: AI Code Review
            identifier: ai_code_review
            description: Harness-managed Code Review agent on pull request builds. Advisory; it does not gate the build.
            type: CI
            when:
              pipelineStatus: Success
              condition: <+codebase.build.type> == "PR"
            spec:
              cloneCodebase: true
              caching:
                enabled: false
              buildIntelligence:
                enabled: false
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Agent
                      name: Code Review - AI
                      identifier: code_review
                      spec:
                        agentName: aiCodeReviewAgent
                        agentSettings:
                          model_name: ""
                          max_turns: "150"
                          verify_max_turns: "150"
                      timeout: 20m
                      failureStrategies:
                        - onFailure:
                            errors:
                              - AllErrors
                            action:
                              type: Retry
                              spec:
                                retryCount: 1
                                retryIntervals:
                                  - 15s
                                onRetryFailure:
                                  action:
                                    type: MarkAsSuccess
            failureStrategies:
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: MarkAsFailure
        - stage:
            name: Go CI - telemetry-ingest
            identifier: go_ci
            description: Lint, split unit tests, build, smoke test, push and scan the Go service.
            type: CI
            when:
              pipelineStatus: Success
              condition: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.GO_CHANGED> == "true"
            spec:
              cloneCodebase: true
              caching:
                enabled: true
                key: go-telemetry-ingest-{{ checksum "services/telemetry-ingest/go.mod" }}
                paths:
                  - /harness/.cache/go
                  - /harness/.cache/go-build
                  - /harness/.cache/golangci-lint
              buildIntelligence:
                enabled: false
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Download Modules
                      identifier: go_deps
                      spec:
                        connectorRef: ffdockerconnector
                        image: golang:1.24
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          cd "$SERVICE_DIR"
                          go mod download
                          go install gotest.tools/gotestsum@v1.12.3
                      timeout: 10m
                  - parallel:
                      - step:
                          type: Run
                          name: Lint - golangci-lint
                          identifier: go_lint
                          spec:
                            connectorRef: ffdockerconnector
                            image: golangci/golangci-lint:v1.64.8
                            shell: Bash
                            command: |-
                              set -euo pipefail
                              cd "$SERVICE_DIR"
                              golangci-lint run ./...
                          timeout: 10m
                      - step:
                          type: Run
                          name: Go Vet
                          identifier: go_vet
                          spec:
                            connectorRef: ffdockerconnector
                            image: golang:1.24
                            shell: Bash
                            command: |-
                              set -euo pipefail
                              cd "$SERVICE_DIR"
                              go vet ./...
                          timeout: 10m
                  - step:
                      type: Run
                      name: Unit Tests - Split
                      identifier: go_unit_tests
                      spec:
                        connectorRef: ffdockerconnector
                        image: golang:1.24
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          cd "$SERVICE_DIR"
                          INDEX="${HARNESS_NODE_INDEX:-0}"
                          TOTAL="${HARNESS_NODE_TOTAL:-1}"
                          # Each parallel node takes every TOTAL-th package that has tests.
                          PKGS=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... \
                            | awk -v i="$INDEX" -v n="$TOTAL" 'NF && (c++ % n) == i')
                          mkdir -p /harness/reports/go
                          if [ -z "$PKGS" ]; then
                            echo "No test packages assigned to node $INDEX of $TOTAL"
                          else
                            echo "Node $INDEX/$TOTAL testing:"; echo "$PKGS"
                            "$GOPATH/bin/gotestsum" --format testname \
                              --junitfile "/harness/reports/go/junit-$INDEX.xml" \
                              -- -race -count=1 -coverprofile="/harness/reports/go/coverage-$INDEX.out" $PKGS
                          fi
                        reports:
                          type: JUnit
                          spec:
                            paths:
                              - /harness/reports/go/junit-*.xml
                      strategy:
                        parallelism: 2
                      timeout: 15m
                  - step:
                      type: Run
                      name: Build Binary
                      identifier: go_build
                      spec:
                        connectorRef: ffdockerconnector
                        image: golang:1.24
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          cd "$SERVICE_DIR"
                          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
                            -ldflags "-s -w -X main.version=$IMAGE_TAG" \
                            -o bin/telemetry-ingest ./cmd/telemetry-ingest
                          ls -lh bin/
                        envVariables:
                          IMAGE_TAG: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.IMAGE_TAG>
                      timeout: 10m
                  - step:
                      type: Background
                      name: Start telemetry-ingest
                      identifier: go_service
                      spec:
                        connectorRef: ffdockerconnector
                        image: golang:1.24
                        shell: Sh
                        command: ./services/telemetry-ingest/bin/telemetry-ingest
                        envVariables:
                          PORT: "8080"
                  - step:
                      type: Run
                      name: Smoke Test
                      identifier: go_smoke_test
                      spec:
                        connectorRef: ffdockerconnector
                        image: curlimages/curl:8.10.1
                        shell: Sh
                        command: |-
                          set -eu
                          BASE=http://go_service:8080
                          for i in $(seq 1 30); do curl -fsS "$BASE/healthz" && break; sleep 1; done
                          curl -fsS "$BASE/healthz"
                          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/v1/readings" \
                            -H 'Content-Type: application/json' \
                            -d '{"vehicleId":"SMOKE-1","timestamp":"2020-01-01T00:00:00Z","speedKph":80,"batteryPercent":50,"batteryTempC":30,"tirePressureKpa":[230,230,230,230]}')
                          echo "POST /v1/readings -> $STATUS"
                          [ "$STATUS" = "202" ]
                          curl -fsS "$BASE/v1/vehicles/SMOKE-1/stats"
                      timeout: 5m
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and Push to HAR
                      identifier: go_build_push
                      spec:
                        registryRef: <+pipeline.variables.har_registry>
                        repo: telemetry-ingest
                        tags:
                          - <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.IMAGE_TAG>
                          - latest
                        context: services/telemetry-ingest
                        dockerfile: services/telemetry-ingest/Dockerfile
                        labels:
                          org.opencontainers.image.revision: <+codebase.commitSha>
                          org.opencontainers.image.source: <+codebase.repoUrl>
                        caching: true
                      timeout: 15m
                  - step:
                      type: AquaTrivy
                      name: Container Scan - Trivy
                      identifier: go_image_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: container
                          detection: auto
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                        privileged: true
                        image:
                          type: harness
                          tag: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.IMAGE_TAG>
                          registry: aumovio-snapshot
                          image_path: telemetry-ingest
                          name: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.HAR_REPO_PATH>/telemetry-ingest
                          domain: pkg.harness.io
                        sbom:
                          format: spdx-json
                      timeout: 15m
            variables:
              - name: SERVICE_DIR
                type: String
                value: services/telemetry-ingest
              - name: GOPATH
                type: String
                value: /harness/.cache/go
              - name: GOCACHE
                type: String
                value: /harness/.cache/go-build
              - name: GOLANGCI_LINT_CACHE
                type: String
                value: /harness/.cache/golangci-lint
              - name: GOFLAGS
                type: String
                value: "-buildvcs=false"
            failureStrategies:
              - onFailure:
                  errors:
                    - Connectivity
                    - Timeout
                  action:
                    type: Retry
                    spec:
                      retryCount: 2
                      retryIntervals:
                        - 10s
                      onRetryFailure:
                        action:
                          type: MarkAsFailure
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: MarkAsFailure
        - stage:
            name: Java CI - fleet-service
            identifier: java_ci
            description: Test Intelligence tests, Build Intelligence package, smoke test, push and scan.
            type: CI
            when:
              pipelineStatus: Success
              condition: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.JAVA_CHANGED> == "true"
            spec:
              cloneCodebase: true
              caching:
                enabled: true
                key: maven-fleet-service-{{ checksum "services/fleet-service/pom.xml" }}
                paths:
                  - /harness/.m2/repository
              buildIntelligence:
                enabled: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Test
                      name: Unit Tests - Test Intelligence
                      identifier: java_tests_ti
                      spec:
                        connectorRef: ffdockerconnector
                        image: maven:3.9.9-eclipse-temurin-17
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          mvn test -pl "$SERVICE_DIR" -amd -Dmaven.build.cache.enabled=false -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
                        intelligenceMode: true
                        reports:
                          type: JUnit
                          spec:
                            paths:
                              - /harness/<+stage.variables.SERVICE_DIR>/**/target/surefire-reports/TEST-*.xml
                      timeout: 20m
                  - step:
                      type: Run
                      name: Package - Build Intelligence
                      identifier: java_package
                      spec:
                        connectorRef: ffdockerconnector
                        image: maven:3.9.9-eclipse-temurin-17
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          mvn package -pl "$SERVICE_DIR" -amd -DskipTests -Dmaven.build.cache.configPath=/harness/.mvn/maven-build-cache-config.xml
                          ls -lh "$SERVICE_DIR"/fleet-api/target/*.jar
                      timeout: 15m
                  - step:
                      type: Background
                      name: Start fleet-api
                      identifier: java_service
                      spec:
                        connectorRef: ffdockerconnector
                        image: eclipse-temurin:17-jre
                        shell: Sh
                        command: java -jar services/fleet-service/fleet-api/target/fleet-api.jar
                        envVariables:
                          PORT: "8081"
                          APP_VERSION: smoke
                  - step:
                      type: Run
                      name: Smoke Test
                      identifier: java_smoke_test
                      spec:
                        connectorRef: ffdockerconnector
                        image: curlimages/curl:8.10.1
                        shell: Sh
                        command: |-
                          set -eu
                          BASE=http://java_service:8081
                          for i in $(seq 1 60); do curl -fsS "$BASE/healthz" && break; sleep 1; done
                          curl -fsS "$BASE/healthz"
                          curl -fsS "$BASE/v1/fleet/report"
                          curl -fsS "$BASE/v1/vehicles" > /dev/null
                      timeout: 5m
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and Push to HAR
                      identifier: java_build_push
                      spec:
                        registryRef: <+pipeline.variables.har_registry>
                        repo: fleet-service
                        tags:
                          - <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.IMAGE_TAG>
                          - latest
                        context: services/fleet-service
                        dockerfile: services/fleet-service/Dockerfile
                        labels:
                          org.opencontainers.image.revision: <+codebase.commitSha>
                          org.opencontainers.image.source: <+codebase.repoUrl>
                        caching: true
                      timeout: 15m
                  - step:
                      type: AquaTrivy
                      name: Container Scan - Trivy
                      identifier: java_image_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: container
                          detection: auto
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                        privileged: true
                        image:
                          type: harness
                          tag: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.IMAGE_TAG>
                          registry: aumovio-snapshot
                          image_path: fleet-service
                          name: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.HAR_REPO_PATH>/fleet-service
                          domain: pkg.harness.io
                        sbom:
                          format: spdx-json
                      timeout: 15m
            variables:
              - name: SERVICE_DIR
                type: String
                value: services/fleet-service
              - name: MAVEN_ARGS
                type: String
                value: "-B -ntp -Dmaven.repo.local=/harness/.m2/repository"
            failureStrategies:
              - onFailure:
                  errors:
                    - Connectivity
                    - Timeout
                  action:
                    type: Retry
                    spec:
                      retryCount: 2
                      retryIntervals:
                        - 10s
                      onRetryFailure:
                        action:
                          type: MarkAsFailure
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: MarkAsFailure
        - stage:
            name: Node CI - dashboard-api
            identifier: node_ci
            description: Lint, Jest with Test Intelligence, smoke test, push and scan.
            type: CI
            when:
              pipelineStatus: Success
              condition: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.NODE_CHANGED> == "true"
            spec:
              cloneCodebase: true
              caching:
                enabled: true
                key: npm-dashboard-api-{{ checksum "services/dashboard-api/package-lock.json" }}
                paths:
                  - /harness/.npm
              buildIntelligence:
                enabled: false
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Install Dependencies
                      identifier: node_install
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          cd "$SERVICE_DIR"
                          npm ci --no-audit --no-fund
                      timeout: 10m
                  - parallel:
                      - step:
                          type: Run
                          name: Lint - ESLint
                          identifier: node_lint
                          spec:
                            connectorRef: ffdockerconnector
                            image: node:20
                            shell: Bash
                            command: |-
                              set -euo pipefail
                              cd "$SERVICE_DIR"
                              npm run lint
                          timeout: 10m
                      - step:
                          type: Test
                          name: Unit Tests - Jest with Test Intelligence
                          identifier: node_tests_ti
                          spec:
                            connectorRef: ffdockerconnector
                            image: node:20
                            shell: Bash
                            command: |-
                              set -euo pipefail
                              cd "$SERVICE_DIR"
                              npx jest --ci
                            envVariables:
                              HARNESS_TI_QA_ENV: QA_ENV_ENABLED
                            intelligenceMode: true
                            reports:
                              type: JUnit
                              spec:
                                paths:
                                  - /harness/<+stage.variables.SERVICE_DIR>/reports/junit.xml
                          timeout: 15m
                  - step:
                      type: Background
                      name: Start dashboard-api
                      identifier: node_service
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Sh
                        command: node services/dashboard-api/src/server.js
                        envVariables:
                          PORT: "3000"
                          APP_VERSION: smoke
                  - step:
                      type: Run
                      name: Smoke Test
                      identifier: node_smoke_test
                      spec:
                        connectorRef: ffdockerconnector
                        image: curlimages/curl:8.10.1
                        shell: Sh
                        command: |-
                          set -eu
                          BASE=http://node_service:3000
                          for i in $(seq 1 30); do curl -fsS "$BASE/healthz" && break; sleep 1; done
                          curl -fsS "$BASE/healthz"
                          curl -fsS "$BASE/v1/fleet/summary" > /dev/null
                          curl -fsS "$BASE/v1/vehicles/VIN-1001?units=imperial"
                      timeout: 5m
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and Push to HAR
                      identifier: node_build_push
                      spec:
                        registryRef: <+pipeline.variables.har_registry>
                        repo: dashboard-api
                        tags:
                          - <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.IMAGE_TAG>
                          - latest
                        context: services/dashboard-api
                        dockerfile: services/dashboard-api/Dockerfile
                        labels:
                          org.opencontainers.image.revision: <+codebase.commitSha>
                          org.opencontainers.image.source: <+codebase.repoUrl>
                        caching: true
                      timeout: 15m
                  - step:
                      type: AquaTrivy
                      name: Container Scan - Trivy
                      identifier: node_image_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: container
                          detection: auto
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                        privileged: true
                        image:
                          type: harness
                          tag: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.IMAGE_TAG>
                          registry: aumovio-snapshot
                          image_path: dashboard-api
                          name: <+pipeline.stages.detect_changes.spec.execution.steps.detect_changes.output.outputVariables.HAR_REPO_PATH>/dashboard-api
                          domain: pkg.harness.io
                        sbom:
                          format: spdx-json
                      timeout: 15m
            variables:
              - name: SERVICE_DIR
                type: String
                value: services/dashboard-api
              - name: npm_config_cache
                type: String
                value: /harness/.npm
            failureStrategies:
              - onFailure:
                  errors:
                    - Connectivity
                    - Timeout
                  action:
                    type: Retry
                    spec:
                      retryCount: 2
                      retryIntervals:
                        - 10s
                      onRetryFailure:
                        action:
                          type: MarkAsFailure
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: MarkAsFailure
    - parallel:
        - stage:
            name: E2E Tests and AI Triage
            identifier: e2e_tests
            description: Runs all three services together, executes the cross-service E2E suite with flaky-test retry, has the triage agent classify failures, and gates the build fail-closed.
            type: CI
            when:
              pipelineStatus: Success
              condition: <+pipeline.stages.change_intelligence.spec.execution.steps.resolve_plan.output.outputVariables.RUN_E2E> == "true"
            spec:
              cloneCodebase: true
              caching:
                enabled: true
                key: e2e-{{ checksum "services/telemetry-ingest/go.mod" }}-{{ checksum "services/fleet-service/pom.xml" }}
                paths:
                  - /harness/.cache/go
                  - /harness/.cache/go-build
                  - /harness/.m2/repository
              buildIntelligence:
                enabled: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Apply Demo Scenario
                      identifier: apply_demo_scenario
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          case "$E2E_SCENARIO" in
                            regression|outdated_test) ;;
                            *) echo "e2e_scenario must be exactly one of none, regression, outdated_test (got '${E2E_SCENARIO}')."; exit 1 ;;
                          esac
                          PATCH="demo/e2e-scenarios/${E2E_SCENARIO}.patch"
                          echo "Injecting demo scenario '${E2E_SCENARIO}':"
                          sed -n '1,/^---$/p' "$PATCH"
                          git apply --verbose "$PATCH"
                          git diff --stat
                        envVariables:
                          E2E_SCENARIO: <+pipeline.variables.e2e_scenario>
                      when:
                        stageStatus: Success
                        condition: <+pipeline.variables.e2e_scenario> != "none"
                      timeout: 2m
                  - parallel:
                      - step:
                          type: Run
                          name: Build telemetry-ingest
                          identifier: build_telemetry_ingest
                          spec:
                            connectorRef: ffdockerconnector
                            image: golang:1.24
                            shell: Bash
                            command: |-
                              set -euo pipefail
                              cd services/telemetry-ingest
                              CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=e2e-<+codebase.shortCommitSha>" \
                                -o bin/telemetry-ingest ./cmd/telemetry-ingest
                          timeout: 10m
                      - step:
                          type: Run
                          name: Build fleet-service
                          identifier: build_fleet_service
                          spec:
                            connectorRef: ffdockerconnector
                            image: maven:3.9.9-eclipse-temurin-17
                            shell: Bash
                            command: |-
                              set -euo pipefail
                              mvn package -pl services/fleet-service -amd -DskipTests -Dmaven.build.cache.configPath=/harness/.mvn/maven-build-cache-config.xml
                          timeout: 15m
                  - step:
                      type: Background
                      name: Start telemetry-ingest
                      identifier: e2e_telemetry
                      spec:
                        connectorRef: ffdockerconnector
                        image: golang:1.24
                        shell: Sh
                        command: |-
                          mkdir -p /harness/.agent/logs
                          ./services/telemetry-ingest/bin/telemetry-ingest 2>&1 | tee /harness/.agent/logs/telemetry-ingest.log
                        envVariables:
                          PORT: "8080"
                  - step:
                      type: Background
                      name: Start fleet-service
                      identifier: e2e_fleet
                      spec:
                        connectorRef: ffdockerconnector
                        image: eclipse-temurin:17-jre
                        shell: Sh
                        command: |-
                          mkdir -p /harness/.agent/logs
                          java -jar services/fleet-service/fleet-api/target/fleet-api.jar 2>&1 | tee /harness/.agent/logs/fleet-service.log
                        envVariables:
                          PORT: "8081"
                          APP_VERSION: e2e
                  - step:
                      type: Background
                      name: Start dashboard-api
                      identifier: e2e_dashboard
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Sh
                        command: |-
                          mkdir -p /harness/.agent/logs
                          node services/dashboard-api/src/server.js 2>&1 | tee /harness/.agent/logs/dashboard-api.log
                        envVariables:
                          PORT: "3000"
                          APP_VERSION: e2e
                  - step:
                      type: Run
                      name: Run E2E Suite
                      identifier: run_e2e
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          node tests/e2e/run.mjs
                          set -a; . "$E2E_REPORT_DIR/outputs.env"; set +a
                        envVariables:
                          TELEMETRY_URL: http://e2e_telemetry:8080
                          FLEET_URL: http://e2e_fleet:8081
                          DASHBOARD_URL: http://e2e_dashboard:3000
                        outputVariables:
                          - name: E2E_STATUS
                          - name: E2E_TOTAL
                          - name: E2E_FAILED
                          - name: E2E_FLAKY
                          - name: E2E_NEEDS_TRIAGE
                        reports:
                          type: JUnit
                          spec:
                            paths:
                              - /harness/tests/e2e/reports/junit-*.xml
                      timeout: 15m
                  - step:
                      type: Run
                      name: Collect Failure Evidence
                      identifier: collect_e2e_evidence
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          node scripts/ci/change-context.mjs > /dev/null
                          node scripts/ci/collect-e2e-evidence.mjs
                        envVariables:
                          BUILD_TYPE: <+codebase.build.type>
                          BASE_SHA: <+codebase.baseCommitSha>
                          PR_NUMBER: <+codebase.prNumber>
                          BRANCH: <+codebase.branch>
                          FORCE_ALL: <+pipeline.variables.force_all>
                          E2E_SCENARIO: <+pipeline.variables.e2e_scenario>
                      when:
                        stageStatus: Success
                        condition: <+execution.steps.run_e2e.output.outputVariables.E2E_NEEDS_TRIAGE> == "true"
                      timeout: 5m
                  - step:
                      type: Agent
                      name: Triage E2E Failures - AI
                      identifier: triage_e2e_failures
                      spec:
                        agentName: ca_e2e_failure_triage_agent
                        agentSettings:
                          changeContextPath: /harness/.agent/change/context.md
                          diffPath: /harness/.agent/change/diff.patch
                          evidenceJsonPath: /harness/.agent/e2e/evidence.json
                          evidencePath: /harness/.agent/e2e/evidence.md
                          outputDir: /harness/.agent/output
                          repository: prameetu20codes/aumovio-ci-demo
                      when:
                        stageStatus: Success
                        condition: <+execution.steps.run_e2e.output.outputVariables.E2E_NEEDS_TRIAGE> == "true"
                      timeout: 20m
                      failureStrategies:
                        - onFailure:
                            errors:
                              - AllErrors
                            action:
                              type: Retry
                              spec:
                                retryCount: 1
                                retryIntervals:
                                  - 15s
                                onRetryFailure:
                                  action:
                                    type: MarkAsSuccess
                  - step:
                      type: Run
                      name: E2E Quality Gate
                      identifier: e2e_quality_gate
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Bash
                        command: |-
                          set -uo pipefail
                          if [ -f "$AGENT_DIR/output/e2e-triage.md" ]; then
                            echo "----- E2E Failure Triage report -----"
                            cat "$AGENT_DIR/output/e2e-triage.md"
                            echo "-------------------------------------"
                          fi
                          node scripts/ci/e2e-gate.mjs
                        envVariables:
                          E2E_STATUS: <+execution.steps.run_e2e.output.outputVariables.E2E_STATUS>
                          E2E_FAILED: <+execution.steps.run_e2e.output.outputVariables.E2E_FAILED>
                          E2E_FLAKY: <+execution.steps.run_e2e.output.outputVariables.E2E_FLAKY>
                          VERDICT: <+execution.steps.triage_e2e_failures.steps.ca_e2e_failure_triage_agent_1.output.outputVariables.VERDICT>
                          CONFIDENCE: <+execution.steps.triage_e2e_failures.steps.ca_e2e_failure_triage_agent_1.output.outputVariables.CONFIDENCE>
                          SUMMARY: <+execution.steps.triage_e2e_failures.steps.ca_e2e_failure_triage_agent_1.output.outputVariables.SUMMARY>
                          CONFIDENCE_THRESHOLD: <+pipeline.variables.triage_confidence_threshold>
                          OUTDATED_TEST_POLICY: <+pipeline.variables.outdated_test_policy>
                      when:
                        stageStatus: All
                      timeout: 5m
            variables:
              - name: AGENT_DIR
                type: String
                value: /harness/.agent
              - name: E2E_REPORT_DIR
                type: String
                value: /harness/tests/e2e/reports
              - name: GOPATH
                type: String
                value: /harness/.cache/go
              - name: GOCACHE
                type: String
                value: /harness/.cache/go-build
              - name: GOFLAGS
                type: String
                value: "-buildvcs=false"
              - name: MAVEN_ARGS
                type: String
                value: "-B -ntp -Dmaven.repo.local=/harness/.m2/repository"
            failureStrategies:
              - onFailure:
                  errors:
                    - Connectivity
                    - Timeout
                  action:
                    type: Retry
                    spec:
                      retryCount: 2
                      retryIntervals:
                        - 10s
                      onRetryFailure:
                        action:
                          type: MarkAsFailure
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: MarkAsFailure
        - stage:
            name: Dockerfile and Build-Cache Review
            identifier: dockerfile_review
            description: hadolint plus the Dockerfile Optimizer agent. hadolint errors and agent-reported blocking findings fail the build; recommendations are reported.
            type: CI
            when:
              pipelineStatus: Success
              condition: <+pipeline.stages.change_intelligence.spec.execution.steps.resolve_plan.output.outputVariables.RUN_DOCKERFILE_REVIEW> == "true"
            spec:
              cloneCodebase: true
              caching:
                enabled: false
              buildIntelligence:
                enabled: false
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Lint Dockerfiles - hadolint
                      identifier: hadolint
                      spec:
                        connectorRef: ffdockerconnector
                        image: hadolint/hadolint:v2.12.0-debian
                        shell: Sh
                        command: |-
                          set -eu
                          mkdir -p "$AGENT_DIR/dockerfile"
                          hadolint --no-fail --format json services/*/Dockerfile > "$AGENT_DIR/dockerfile/hadolint.json"
                          hadolint --no-fail services/*/Dockerfile
                      timeout: 5m
                  - step:
                      type: Run
                      name: Collect Dockerfile Context
                      identifier: dockerfile_context
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Bash
                        command: |-
                          set -euo pipefail
                          node scripts/ci/dockerfile-context.mjs
                          set -a; . "$AGENT_DIR/dockerfile/hadolint.env"; set +a
                        outputVariables:
                          - name: HADOLINT_ERRORS
                          - name: HADOLINT_WARNINGS
                      timeout: 5m
                  - step:
                      type: Agent
                      name: Optimize Dockerfiles - AI
                      identifier: optimize_dockerfiles
                      spec:
                        agentName: ca_dockerfile_optimizer_agent
                        agentSettings:
                          contextPath: /harness/.agent/dockerfile/context.md
                          outputDir: /harness/.agent/output
                          repository: prameetu20codes/aumovio-ci-demo
                      timeout: 20m
                      failureStrategies:
                        - onFailure:
                            errors:
                              - AllErrors
                            action:
                              type: Retry
                              spec:
                                retryCount: 1
                                retryIntervals:
                                  - 15s
                                onRetryFailure:
                                  action:
                                    type: MarkAsSuccess
                  - step:
                      type: Run
                      name: Dockerfile Quality Gate
                      identifier: dockerfile_gate
                      spec:
                        connectorRef: ffdockerconnector
                        image: node:20
                        shell: Bash
                        command: |-
                          set -uo pipefail
                          if [ -f "$AGENT_DIR/output/dockerfile-review.md" ]; then
                            echo "----- Dockerfile Optimizer report -----"
                            cat "$AGENT_DIR/output/dockerfile-review.md"
                            echo "---------------------------------------"
                          fi
                          node scripts/ci/dockerfile-gate.mjs
                        envVariables:
                          HADOLINT_ERRORS: <+execution.steps.dockerfile_context.output.outputVariables.HADOLINT_ERRORS>
                          HADOLINT_WARNINGS: <+execution.steps.dockerfile_context.output.outputVariables.HADOLINT_WARNINGS>
                          BLOCKING_FINDINGS: <+execution.steps.optimize_dockerfiles.steps.ca_dockerfile_optimizer_agent_1.output.outputVariables.BLOCKING_FINDINGS>
                          TOTAL_FINDINGS: <+execution.steps.optimize_dockerfiles.steps.ca_dockerfile_optimizer_agent_1.output.outputVariables.TOTAL_FINDINGS>
                          SUMMARY: <+execution.steps.optimize_dockerfiles.steps.ca_dockerfile_optimizer_agent_1.output.outputVariables.SUMMARY>
                      when:
                        stageStatus: All
                      timeout: 5m
            variables:
              - name: AGENT_DIR
                type: String
                value: /harness/.agent
            failureStrategies:
              - onFailure:
                  errors:
                    - Connectivity
                    - Timeout
                  action:
                    type: Retry
                    spec:
                      retryCount: 2
                      retryIntervals:
                        - 10s
                      onRetryFailure:
                        action:
                          type: MarkAsFailure
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: MarkAsFailure
    - stage:
        name: AI Autofix
        identifier: ai_autofix
        description: Runs only when an earlier stage failed. The Harness-managed Autofix agent analyses the failure and proposes a fix for human review.
        type: CI
        when:
          pipelineStatus: Failure
        spec:
          cloneCodebase: true
          caching:
            enabled: false
          buildIntelligence:
            enabled: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Agent
                  name: Autofix - AI
                  identifier: autofix
                  spec:
                    agentName: autofixAgent
                    agentSettings:
                      execution_id: <+pipeline.executionId>
                      source_pipeline_id: <+pipeline.identifier>
                      repo: prameetu20codes/aumovio-ci-demo
                      branch: <+codebase.branch>
                      mcp_connectors:
                        - mcpconnector
                      llm_connector: account.harnessAnthropic
                      model_name: claude-sonnet-4-6
                  timeout: 30m
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
