trigger:
  name: Push to main
  identifier: push_main
  enabled: false
  description: Optional. Enable to also build main after every merge (publishes main-<sha> images). Disabled for the PR-only demo.
  tags:
    customer: aumovio
  orgIdentifier: testprameet
  projectIdentifier: testproj
  pipelineIdentifier: aumovio_monorepo_ci
  stagesToExecute: []
  source:
    type: Webhook
    spec:
      type: Github
      spec:
        type: Push
        spec:
          connectorRef: harness_testing
          autoAbortPreviousExecutions: true
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: main
          headerConditions: []
          repoName: aumovio-ci-demo
          actions: []
  inputYaml: |
    pipeline:
      identifier: aumovio_monorepo_ci
      properties:
        ci:
          codebase:
            build:
              type: branch
              spec:
                branch: <+trigger.branch>
      variables:
        - name: force_all
          type: String
          value: "false"
