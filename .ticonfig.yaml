# Files that must never cause Test Intelligence to select tests.
config:
  ignore:
    - "README.md"
    - "pom.xml"
    - "docs/**/*"
    - ".ticonfig.yaml"
    - ".harness/**/*"
    - "harness-manual/**/*"
    - "scripts/**/*"
    - "tests/e2e/**/*"
    - "**/Dockerfile*"
    - "**/*.go"
    - "**/go.mod"
    - "**/.golangci.yml"
