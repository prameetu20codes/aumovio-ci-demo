trigger:
  name: Learning Loop - Nightly trend analysis
  identifier: learning_loop_nightly
  enabled: true
  description: Runs the CI learning loop every night without a CI run (run_ci=false). The Knowledge Graph agent analyses the last 30 days of aumovio_monorepo_ci_agentic executions and the Remediation agent proposes pipeline and strategy changes and a playbook update.
  tags:
    customer: aumovio
    ai: worker-agents
  orgIdentifier: testprameet
  projectIdentifier: testproj
  pipelineIdentifier: aumovio_ci_learning_loop
  stagesToExecute: []
  source:
    type: Scheduled
    spec:
      type: Cron
      spec:
        type: UNIX
        expression: 30 1 * * *
  pipelineBranchName: main
  inputYaml: |
    pipeline:
      identifier: aumovio_ci_learning_loop
      variables:
        - name: target_branch
          type: String
          value: main
        - name: run_ci
          type: String
          value: "false"
        - name: outdated_test_policy
          type: String
          value: warn
